# Search terms. A term leads to one line, to the "Which direction?" step (one channel gene), to a
# gene picker (a code or name that covers several genes), or to a mechanism. Gene names and IDs
# specific to a direction-split gene (SCN2A, SCN8A, SCN1A) always lead to the direction step.
# Orphanet entries that cover several genes are group aliases: genes lists only seeded genes, and
# seed_check verifies each against the Orphadata file. Variant aliases name the PMID of the claim
# behind them; the build emits a variant alias only once that claim is signed. Symptom (HPO)
# aliases are derived at build time from phenotype.hpoa and the curated hpo_terms.

