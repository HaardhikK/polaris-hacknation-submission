# --- Orphanet entries covering several genes -> gene picker. genes = seeded genes with a
# disease-causing link; group_size = all disease-causing genes in the entry (checked against the
# Orphadata file); the picker always offers "My child's gene isn't listed" -> "Not mapped yet".
# ORPHA:442835 is not listed: Orphanet records SYNGAP1 there only as a candidate gene.
