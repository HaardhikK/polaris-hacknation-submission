# Research assets by station. scope: gene = serves every line of that gene ("Already open to you"
# on both SCN2A lines, never a borrow between them); scope: line = belongs to one direction.
# Channel-gene drugs, trials and models are always line-scoped with a direction and say how that
# direction was established (direction_basis). The Scn2a mouse line MMRRC:069700-UCD is left out
# until its allele direction is sourced.
# retrieved / last_verified: set only for pages the pipeline fetched (ClinicalTrials.gov, PubMed);
# organisation, registry and repository pages stay empty until a person opens them.

