# Disease lines: one gene in one mechanism direction. Hand-curated; every row sourced.
# Direction here is the hand label; the engine acts on it only once a code-checked functional-assay
# claim agrees with it. Sources: the cited papers and databases in each row.
# xrefs: orpha_group marks an Orphanet entry that covers several genes (never a line identifier).
- key: scn2a_gain
  gene: SCN2A
  mechanism: sodium_channel
  mechanism_family: ion_channel
  direction: gain
  label: SCN2A gain of function
  gloss: gain of function — the channel works too strongly
  xrefs:
    hgnc: HGNC:10588
    omim: OMIM:613721
    mondo: MONDO:0013388
    orpha_group: ORPHA:1934
  organisations: [familiescn2a]
  sources:
    - label: Orphanet ORPHA:1934 (21 genes), SCN2A link labelled gain of function (database label)
      url: https://www.orpha.net/en/disease/detail/1934
      retrieved: 2026-10-04
    - label: PMID 31558572, R1882Q functional assay
      url: https://pubmed.ncbi.nlm.nih.gov/31558572/
      retrieved: 2026-10-04
    - label: PMID 20956790, A263V functional assay
      url: https://pubmed.ncbi.nlm.nih.gov/20956790/
      retrieved: 2026-10-04
    - label: PMID 38544375, R1882Q and R853Q functional assays (the code-checked R1882Q claim)
      url: https://pubmed.ncbi.nlm.nih.gov/38544375/
      retrieved: 2026-10-04

- key: scn2a_loss
  gene: SCN2A
  mechanism: sodium_channel
  mechanism_family: ion_channel
  direction: loss
  label: SCN2A loss of function
  gloss: loss of function — the channel works too weakly
  xrefs:
    hgnc: HGNC:10588
    mondo: MONDO:1060245 # umbrella term, never a primary key
    orpha_group: ORPHA:178469
    g2p: G2P00033
  organisations: [familiescn2a]
  sources:
    - label: Gene2Phenotype G2P00033, loss of function (inferred)
      url: https://www.ebi.ac.uk/gene2phenotype/lgd/G2P00033
      retrieved: 2026-10-04
    - label: PMID 34287911, R853Q functional assay
      url: https://pubmed.ncbi.nlm.nih.gov/34287911/
      retrieved: 2026-10-04
  # No official HPO profile exists for this form. Each term is named in the cited abstract:
  # Wolff 2017 (PMID 28379373) for seizures, intellectual disability, autism and West syndrome
  # (p.Arg853Gln); the R853Q assay paper (PMID 34287911) for later-onset epileptic encephalopathy.
  hpo_terms:
    - { id: "HP:0001250", label: Seizure, pmid: "28379373" }
    - { id: "HP:0001249", label: Intellectual disability, pmid: "28379373" }
    - { id: "HP:0000717", label: Autism, pmid: "28379373" }
    - { id: "HP:0012469", label: Infantile spasms, pmid: "28379373" }
    - { id: "HP:0200134", label: Epileptic encephalopathy, pmid: "34287911" }

