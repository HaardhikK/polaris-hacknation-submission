# Patient organisations. Contact = the organisation's own pages, never a named person.
# last_verified stays empty until a person has opened the page.
- key: familiescn2a
  name: FamilieSCN2A Foundation
  lines: [scn2a_gain, scn2a_loss] # one organisation serves both directions; the build says so
  url: https://www.scn2a.org
  contact_page: https://www.scn2a.org/contact/
  note: Runs the DRAGONFLY natural-history registry on NORD IAMRARE.

