# ClinicalTrials.gov records we cite. genes_named is the hand claim; A5 verifies it against the
# fetched record (conditions, keywords, inclusion criteria) and stores matched_field. Status,
# start date and last-update date are read from the record at build time, never from here.
# note is for curators and is never emitted to the site. retrieved = the A1 fetch date.
